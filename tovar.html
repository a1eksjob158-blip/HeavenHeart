<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Товар — Heaven Heart Archive</title>

    <!-- Основные SEO-метаданные -->
    <meta name="description" content="Посмотреть подробную информацию, характеристики и купить товар в интернет-магазине архивного люкса и премиальных аксессуаров Heaven Heart.">
    <meta name="keywords" content="Heaven Heart, карточка товара, купить сумку, архивный люкс, премиальные аксессуары">
    <meta name="author" content="Heaven Heart Store">

    <!-- Open Graph / Превью для Telegram и соцсетей -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Товар — Heaven Heart Archive">
    <meta property="og:description" content="Эксклюзивное изделие из коллекции архивного люкса Heaven Heart.">
    <meta property="og:image" content="https://ваш-логин.github.io/название-репозитория/logo.png">
    <meta property="og:url" content="https://ваш-логин.github.io/название-репозитория/tovar.html">

    <!-- Twitter Card (карточка для шеринга) -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Товар — Heaven Heart Archive">
    <meta name="twitter:description" content="Эксклюзивное изделие из коллекции архивного люкса Heaven Heart.">
    <meta name="twitter:image" content="https://ваш-логин.github.io/название-репозитория/logo.png">

    <!-- Мобильные настройки интерфейса и темы -->
    <meta name="theme-color" content="#111111">
    <meta name="msapplication-TileColor" content="#111111">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Heaven Heart">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="icon" type="image/png" href="logo.png">

    <!-- Подключение шрифта Montserrat, как на главной странице -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --sat: env(safe-area-inset-top, 0px);
            --sab: env(safe-area-inset-bottom, 0px);
            --sal: env(safe-area-inset-left, 0px);
            --sar: env(safe-area-inset-right, 0px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            color: #111111;
            line-height: 1.6;
            background-color: #ffffff;
            -webkit-text-size-adjust: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding-left: var(--sal);
            padding-right: var(--sar);
            padding-bottom: calc(80px + var(--sab));
        }

        /* Шапка */
        header {
            padding: calc(15px + var(--sat)) 16px 12px 16px;
            text-align: center;
            border-bottom: 1px solid #eaeaea;
        }

        .header-logo {
            max-width: 280px;
            width: 80%;
            height: auto;
            display: inline-block;
            margin-bottom: -10px;
            mix-blend-mode: multiply;
        }

        /* Основной контейнер товара */
        .product-container {
            max-width: 1100px;
            margin: 25px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            flex-grow: 1;
            width: 100%;
        }

        /* Галерея */
        .product-gallery {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .main-image-box {
            width: 100%;
            height: 400px;
            background-color: #f4f4f4;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #eaeaea;
        }

        .main-image-box img, .main-image-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .thumbs-grid {
            display: flex;
            gap: 10px;
        }

        .thumb-item {
            width: 75px;
            height: 75px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #ddd;
            cursor: pointer;
            opacity: 0.6;
            transition: 0.3s;
            flex-shrink: 0;
        }

        .thumb-item.active, .thumb-item:hover {
            opacity: 1;
            border-color: #b38228;
        }

        .thumb-item img, .thumb-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Информация о товаре */
        .product-details {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        /* Контейнер для шапки карточки (название/бренд слева, кнопка справа) */
        .product-header-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 8px;
        }

        .product-title-group {
            flex-grow: 1;
        }

        /* Кнопка возврата в каталог в точности как на главной странице index.html (шрифт и стиль) */
        .back-to-catalog-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #111;
            text-decoration: none;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            border: 1px solid rgba(0, 0, 0, 0.2);
            background: rgba(0, 0, 0, 0.03);
            padding: 7px 18px;
            border-radius: 30px;
            transition: all 0.35s ease;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .back-to-catalog-btn:hover {
            background-color: #111;
            color: #fff;
            transform: translateY(-2px);
        }

        .brand-tag {
            font-size: 0.8rem;
            color: #777;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 5px;
        }

        .product-title {
            font-size: 1.8rem;
            font-weight: 600;
            color: #111;
            margin-bottom: 0;
        }

        .product-price {
            font-size: 1.4rem;
            font-weight: bold;
            color: #111; /* Черный цвет цены */
            margin-bottom: 12px;
        }

        /* Бейдж состояния */
        .condition-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(179, 130, 40, 0.1);
            border: 1px solid rgba(179, 130, 40, 0.3);
            color: #b38228;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 18px;
            width: fit-content;
        }

        .product-description {
            font-size: 0.95rem;
            color: #555;
            margin-bottom: 20px;
            line-height: 1.6;
            white-space: pre-line;
        }

        .specs-list {
            list-style: none;
            margin-bottom: 25px;
            border-top: 1px solid #eaeaea;
            border-bottom: 1px solid #eaeaea;
            padding: 14px 0;
        }

        .specs-list li {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .specs-list li:last-child {
            margin-bottom: 0;
        }

        .specs-list li span:first-child {
            color: #777;
        }

        .specs-list li span:last-child {
            font-weight: 600;
            color: #111;
            text-align: right;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-buy {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: #111;
            color: #fff;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: background 0.3s;
        }

        .btn-buy:hover {
            background-color: #b38228;
        }

        .btn-cart {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: #f4f4f4;
            color: #111;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            border: 1px solid #ddd;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.3s;
        }

        .btn-cart:hover {
            background-color: #111;
            color: #fff;
            border-color: #111;
        }

        /* ПЛАВАЮ ВИДЖЕТ КОРЗИНЫ */
        .floating-cart-btn {
            position: fixed;
            bottom: calc(25px + var(--sab));
            right: 20px;
            z-index: 9998;
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            color: #111111;
            padding: 12px 18px;
            border-radius: 50px;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(0, 0, 0, 0.14);
            cursor: pointer;
            opacity: 0;
            visibility: hidden;
            transform: translateY(20px) scale(0.9);
            pointer-events: none;
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .floating-cart-btn.visible {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .floating-cart-btn:hover {
            transform: translateY(-3px) scale(1.06);
            background: rgba(17, 17, 17, 0.88);
            color: #ffffff;
            border-color: rgba(17, 17, 17, 0.88);
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.22);
        }

        .floating-cart-btn svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            stroke-width: 2.2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.25s ease;
        }

        .floating-cart-btn:hover svg {
            transform: scale(1.08);
        }

        .cart-badge {
            background: #b38228;
            color: #ffffff;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            line-height: 1;
            min-width: 18px;
            text-align: center;
        }

        /* Уведомление */
        .toast-notification {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.85);
            background-color: rgba(17, 17, 17, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #fff;
            padding: 16px 32px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            font-size: 0.95rem;
            font-weight: bold;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10001;
            display: flex;
            align-items: center;
            gap: 12px;
            white-space: nowrap;
        }

        .toast-notification.show {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
            visibility: visible;
        }

        .toast-icon {
            color: #888888;
            font-size: 1.3rem;
        }

        /* Модальное окно быстрой оплаты */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-card {
            background: #fff;
            border-radius: 16px;
            width: 100%;
            max-width: 380px;
            padding: 24px 20px;
            position: relative;
            text-align: center;
        }

        .modal-close {
            position: absolute;
            top: 12px; right: 15px;
            font-size: 1.4rem;
            color: #777;
            background: none;
            border: none;
            cursor: pointer;
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 5px;
            color: #111;
        }

        .modal-price {
            font-size: 1.25rem;
            font-weight: bold;
            color: #111;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #444;
            font-size: 0.85rem;
        }

        .form-group select {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid #ccc;
            background-color: #fff;
            font-size: 1rem;
        }

        .qr-container {
            margin: 15px 0;
            padding: 10px;
            background: #f9f9f9;
            border: 1px solid #eee;
            border-radius: 12px;
        }

        .qr-container img {
            width: 150px;
            height: 150px;
            object-fit: contain;
            display: block;
            margin: 0 auto 8px auto;
        }

        .qr-hint {
            font-size: 0.75rem;
            color: #666;
        }

        .btn-tg-pay {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, #2AABEE, #229ED9);
            color: #fff;
            margin-top: 10px;
            font-size: 0.95rem;
            text-decoration: none;
            padding: 13px;
            border-radius: 30px;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 25px 15px calc(25px + var(--sab)) 15px;
            background-color: #f4f4f4;
            border-top: 1px solid #eaeaea;
            color: #666;
            margin-top: 40px;
            font-size: 0.85rem;
        }

        footer a {
            color: #2AABEE;
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .product-container {
                grid-template-columns: 1fr;
                gap: 20px;
                margin: 10px auto;
                padding: 0 16px;
            }

            .main-image-box {
                height: 300px;
                border-radius: 14px;
            }

            .thumbs-grid {
                overflow-x: auto;
                padding-bottom: 4px;
                scrollbar-width: none;
            }
            .thumbs-grid::-webkit-scrollbar {
                display: none;
            }

            .thumb-item {
                width: 65px;
                height: 65px;
            }

            .product-title {
                font-size: 1.4rem;
            }

            .product-price {
                font-size: 1.25rem;
            }

            .product-description {
                font-size: 0.9rem;
            }

            .btn-buy, .btn-cart {
                padding: 13px 20px;
                font-size: 0.95rem;
            }

            .floating-cart-btn {
                padding: 10px 14px;
                right: 14px;
                bottom: calc(20px + var(--sab));
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" onclick="sessionStorage.removeItem('catalog_scroll_pos');"><img src="logo.png" alt="Heaven Heart" class="header-logo"></a>
    </header>

    <div class="product-container">
        <!-- Блок галереи фотографий -->
        <div class="product-gallery">
            <div class="main-image-box">
                <img src="logo.png" alt="Загрузка..." style="width: 100%; height: 100%; object-fit: cover;">
            </div>
            <div class="thumbs-grid"></div>
        </div>

        <!-- Блок описания и покупки -->
        <div class="product-details">
            <!-- Верхняя строка: бренд/название слева, кнопка каталога справа -->
            <div class="product-header-row">
                <div class="product-title-group">
                    <div class="brand-tag">Heaven Heart Archive</div>
                    <h1 class="product-title">Загрузка...</h1>
                </div>
                <!-- Прямая ссылка без history.back() -->
                <a href="index.html" class="back-to-catalog-btn">← Каталог</a>
            </div>

            <div class="product-price">...</div>
            
            <div class="condition-badge" style="display: none;"></div>

            <p class="product-description"></p>

            <ul class="specs-list" style="display: none;"></ul>

            <div class="btn-group">
                <button class="btn-buy">Купить за 1 клик</button>
                <button class="btn-cart">В корзину</button>
            </div>
        </div>
    </div>

    <!-- ПЛАВАЮЩИЙ МИНИ-ВИДЖЕТ КОРЗИНЫ -->
    <div class="floating-cart-btn" id="floatingCartBtn" onclick="window.location.href='cart.html'" title="Корзина">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
        </svg>
        <span class="cart-badge" id="cartBadge">0</span>
    </div>

    <!-- TOAST-УВЕДОМЛЕНИЕ -->

        <span class="toast-icon">✓</span>
        <span id="toastMessage">Товар добавлен в корзину</span>
    </div>

    <!-- Модальное окно быстрой оплаты -->
    <div class="modal-overlay" id="quickPayModal" onclick="closeQuickPay(event)">
        <div class="modal-card" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeQuickPay()">&times;</button>
            <div class="modal-title" id="modalProductName">Товар</div>
            <div class="modal-price" id="modalProductPrice">0 ₽</div>

            <div class="form-group">
                <label for="citySelect">Город доставки:</label>
                <select id="citySelect">
                    <option value="Москва">Москва</option>
                    <option value="Санкт-Петербург">Санкт-Петербург</option>
                    <option value="Другой город РФ">Другой город РФ (+ доставка)</option>
                    <option value="Самовывоз">Самовывоз</option>
                </select>
            </div>

            <div class="qr-container">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=https://t.me/bandos158" alt="QR для оплаты">
                <div class="qr-hint">Отсканируйте камерой телефона для перевода по СБП</div>
            </div>

            <a href="#" id="tgCheckoutBtn" target="_blank" class="btn-tg-pay">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.19-.08-.05-.19-.02-.27 0-.12.03-1.99 1.27-5.62 3.72-.53.36-1.01.54-1.44.53-.47-.01-1.38-.27-2.06-.49-.83-.27-1.49-.42-1.43-.88.03-.24.38-.49 1.03-.75 4.04-1.76 6.74-2.92 8.09-3.48 3.85-1.6 4.65-1.88 5.17-1.89.11 0 .37.03.54.17.14.12.18.28.2.45-.02.07-.02.13-.03.22z"/></svg>
                Отправить чек в Telegram
            </a>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Heaven Heart Archive. Все права защищены. | <a href="https://t.me/bandos158" target="_blank">Магазин в Telegram</a></p>
    </footer>

    <script>
        const CATALOG_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyY9UDae3UxnZ7HaqJbzCpaq29PZghWEgfzsDd0n7YGfx7aItb-pCD1g0587gmLJ8_3cg/exec';
        let currentProductImage = 'logo.png';
        let toastTimeout;

        function renderProductData(data, productId) {
            const product = data.find(item => String(item.id) === String(productId));

            if (product) {
                let cleanPrice = 0;
                if (product.price !== undefined && product.price !== null && product.price !== '') {
                    let stringPrice = String(product.price).trim();
                    if (/^\d+([.,]\d+)?$/.test(stringPrice)) {
                        cleanPrice = Math.round(parseFloat(stringPrice.replace(',', '.'))) || 0;
                    }
                }
                const priceStr = cleanPrice > 0 ? cleanPrice.toLocaleString('ru-RU') + ' ₽' : (product.price ? String(product.price) : 'Цена по запросу');
                const safeTitle = (product.title || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');

                document.title = product.title + " — Heaven Heart";
                document.querySelector('.brand-tag').textContent = product.brand || 'Heaven Heart Archive';
                document.querySelector('.product-title').textContent = product.title;
                document.querySelector('.product-price').textContent = priceStr;
                document.querySelector('.product-description').textContent = product.desc || '';
                
                const conditionEl = document.querySelector('.condition-badge');
                if (product.condition) {
                    conditionEl.innerHTML = `✨ Состояние: ${product.condition}`;
                    conditionEl.style.display = 'inline-flex';
                } else {
                    conditionEl.style.display = 'none';
                }

                const specsList = document.querySelector('.specs-list');
                let specsHtml = '';
                if (product.material) specsHtml += `<li><span>Материал:</span> <span>${product.material}</span></li>`;
                if (product.hardware) specsHtml += `<li><span>Фурнитура:</span> <span>${product.hardware}</span></li>`;
                if (product.kit)      specsHtml += `<li><span>Комплектация:</span> <span>${product.kit}</span></li>`;
                
                if (specsHtml) {
                    specsList.innerHTML = specsHtml;
                    specsList.style.display = 'block';
                } else {
                    specsList.style.display = 'none';
                }
                
                const images = product.images ? product.images.split(',').map(s => s.trim()) : ['logo.png'];
                currentProductImage = images[0];
                
                const mainImageBox = document.querySelector('.main-image-box');
                const thumbsGrid = document.querySelector('.thumbs-grid');
                thumbsGrid.innerHTML = '';
                
                function getMediaHTML(src, isMain) {
                    if (src.endsWith('.webm') || src.endsWith('.mp4')) {
                        return `<video ${isMain ? 'autoplay loop muted playsinline' : 'muted loop playsinline'} style="width: 100%; height: 100%; object-fit: cover;"><source src="${src}" type="video/${src.endsWith('.webm') ? 'webm' : 'mp4'}"></video>`;
                    }
                    return `<img src="${src}" alt="Фото товара" style="width: 100%; height: 100%; object-fit: cover;">`;
                }

                mainImageBox.innerHTML = getMediaHTML(currentProductImage, true);
                
                images.forEach((imgSrc, index) => {
                    const thumb = document.createElement('div');
                    thumb.className = 'thumb-item' + (index === 0 ? ' active' : '');
                    thumb.onclick = function() { 
                        mainImageBox.innerHTML = getMediaHTML(imgSrc, true);
                        document.querySelectorAll('.thumb-item').forEach(el => el.classList.remove('active'));
                        this.classList.add('active');
                        currentProductImage = imgSrc;
                    };
                    thumb.innerHTML = getMediaHTML(imgSrc, false);
                    thumbsGrid.appendChild(thumb);
                });

                document.querySelector('.btn-buy').setAttribute('onclick', `openQuickPay('${safeTitle}', '${priceStr}')`);
                document.querySelector('.btn-cart').setAttribute('onclick', `addToCartFromPage('${safeTitle}', ${cleanPrice}, '${product.id}')`);
            } else {
                document.querySelector('.product-title').textContent = "Товар не найден в базе";
            }
        }

        window.addEventListener('DOMContentLoaded', async () => {
            updateCartBadge();
            
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');

            if (!productId) {
                document.querySelector('.product-title').textContent = "Товар не выбран";
                return;
            }

            try {
                let cachedData = JSON.parse(localStorage.getItem('hh_catalog_cache'));
                if (cachedData && Array.isArray(cachedData) && cachedData.length > 0) {
                    renderProductData(cachedData, productId);
                }

                const response = await fetch(CATALOG_WEB_APP_URL);
                const freshData = await response.json();

                if (freshData && Array.isArray(freshData) && freshData.length > 0) {
                    localStorage.setItem('hh_catalog_cache', JSON.stringify(freshData));
                    renderProductData(freshData, productId);
                }
            } catch (error) {
                console.error('Ошибка загрузки товара:', error);
                let cachedData = JSON.parse(localStorage.getItem('hh_catalog_cache'));
                if (cachedData && Array.isArray(cachedData) && cachedData.length > 0) {
                    renderProductData(cachedData, productId);
                } else {
                    document.querySelector('.product-title').textContent = "Ошибка загрузки товара";
                }
            }
        });

        function addToCartFromPage(name, price, itemId) {
            let cart = JSON.parse(localStorage.getItem('hh_cart')) || [];
            
            let existingItem = cart.find(item => String(item.id) === String(itemId));
            let currentQuantity = existingItem ? (existingItem.quantity || 1) : 0;

            if (currentQuantity >= 3) {
                showToast(`Лимит: не более 3 шт.`);
                return;
            }

            if (existingItem) {
                existingItem.quantity = (existingItem.quantity || 1) + 1;
            } else {
                cart.push({ id: String(itemId), name: name, price: price, image: currentProductImage, quantity: 1, url: window.location.href });
            }

            localStorage.setItem('hh_cart', JSON.stringify(cart));
            updateCartBadge();
            showToast(`«${name}» в корзине`);
        }

        function updateCartBadge() {
            let cart = JSON.parse(localStorage.getItem('hh_cart')) || [];
            let totalCount = cart.reduce((sum, item) => sum + (item.quantity || 1), 0);
            const badge = document.getElementById('cartBadge');
            const cartBtn = document.getElementById('floatingCartBtn');
            
            if (badge) badge.textContent = totalCount;
            if (cartBtn) {
                if (totalCount > 0) cartBtn.classList.add('visible');
                else cartBtn.classList.remove('visible');
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toastNotification');
            const toastMsg = document.getElementById('toastMessage');
            toastMsg.textContent = message;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toast.classList.remove('show'), 2500);
        }

        function openQuickPay(productName, productPrice) {
            document.getElementById('modalProductName').textContent = productName;
            document.getElementById('modalProductPrice').textContent = productPrice;
            updateTelegramLink(productName, productPrice);
            document.getElementById('quickPayModal').classList.add('active');
        }

        function closeQuickPay(event) {
            if (!event || event.target.id === 'quickPayModal' || event.target.classList.contains('modal-close')) {
                document.getElementById('quickPayModal').classList.remove('active');
            }
        }

        function updateTelegramLink(name, price) {
            const city = document.getElementById('citySelect').value;
            const text = encodeURIComponent(`Здравствуйте! Оплатил товар: ${name} (${price}). Город доставки: ${city}. Прикрепляю чек:`);
            document.getElementById('tgCheckoutBtn').href = `https://t.me/bandos158?text=${text}`;
        }

        document.getElementById('citySelect').addEventListener('change', function() {
            const name = document.getElementById('modalProductName').textContent;
            const price = document.getElementById('modalProductPrice').textContent;
            updateTelegramLink(name, price);
        });
    </script>
</body>
</html>
