<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Товар — Heaven Heart Archive</title>

    <!-- Основные SEO-метаданные -->
    <meta name="description" content="Посмотреть подробную информацию, характеристики и купить товар в интернет-магазине Heaven Heart.">
    
    <!-- Подключение шрифта Montserrat (как на главной) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --sat: env(safe-area-inset-top, 0px);
            --sab: env(safe-area-inset-bottom, 0px);
            --sal: env(safe-area-inset-left, 0px);
            --sar: env(safe-area-inset-right, 0px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            overflow-x: hidden; 
            width: 100%;
            max-width: 100vw; 
            position: relative;
        }

        body {
            color: #111111;
            line-height: 1.6;
            background-color: #ffffff;
            -webkit-text-size-adjust: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding-left: var(--sal);
            padding-right: var(--sar);
            padding-bottom: calc(80px + var(--sab));
        }

        /* Единая шапка (как на главной) */
        header {
            background-color: transparent;
            padding: calc(15px + var(--sat)) 16px 12px 16px;
            text-align: center;
            border-bottom: 1px solid #eaeaea;
        }

        .header-logo {
            max-width: 280px;
            width: 85%;
            height: auto;
            display: inline-block;
            margin-bottom: -10px;
            mix-blend-mode: multiply;
            cursor: pointer;
        }

        header p {
            font-size: 0.8rem;
            font-weight: 500;
            color: #666666;
            margin: 2px 0 12px 0;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* Основной контейнер товара */
        .product-container {
            max-width: 1100px;
            margin: 25px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            flex-grow: 1;
            width: 100%;
        }

        /* Галерея */
        .product-gallery {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%; 
            min-width: 0; 
        }

        .main-image-box {
            width: 100%;
            height: 400px;
            background-color: #f4f4f4;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #eaeaea;
            cursor: pointer;
            position: relative;
        }

        .main-image-box::after {
            content: '🔍';
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .main-image-box:hover::after {
            opacity: 1;
        }

        .main-image-box img, .main-image-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .thumbs-grid {
            display: flex;
            gap: 10px;
        }

        .thumb-item {
            width: 75px;
            height: 75px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #ddd;
            cursor: pointer;
            opacity: 0.6;
            transition: 0.3s;
            flex-shrink: 0;
        }

        .thumb-item.active, .thumb-item:hover {
            opacity: 1;
            border-color: #b38228;
        }

        .thumb-item img, .thumb-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Информация о товаре */
        .product-details {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            width: 100%;
            min-width: 0; 
            max-width: 100%;
        }

        .product-header-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 8px;
            flex-wrap: wrap; 
        }

        .product-title-group {
            flex-grow: 1;
            min-width: 0; 
            word-wrap: break-word;
        }

        .back-to-catalog-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #111;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            border: 1px solid rgba(0, 0, 0, 0.2);
            background: rgba(0, 0, 0, 0.03);
            padding: 7px 18px;
            border-radius: 30px;
            transition: all 0.35s ease;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .back-to-catalog-btn:hover {
            background-color: #111;
            color: #fff;
            transform: translateY(-2px);
        }

        .brand-tag {
            font-size: 0.8rem;
            color: #777;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .product-title {
            font-size: 1.8rem;
            font-weight: 600;
            color: #111;
            margin-bottom: 0;
            word-wrap: break-word; 
        }

        .product-price {
            font-size: 1.4rem;
            font-weight: 700;
            color: #111;
            margin-bottom: 12px;
        }

        .condition-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(179, 130, 40, 0.1);
            border: 1px solid rgba(179, 130, 40, 0.3);
            color: #b38228;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 18px;
            width: fit-content;
            max-width: 100%;
            word-wrap: break-word;
        }

        .product-description {
            font-size: 0.95rem;
            color: #333; /* Сделал чуть темнее для читаемости */
            margin-bottom: 20px;
            line-height: 1.6;
            white-space: pre-line;
            word-wrap: break-word; 
            overflow-wrap: break-word;
            max-width: 100%;
            font-weight: 400;
        }

        .specs-list {
            list-style: none;
            margin-bottom: 25px;
            border-top: 1px solid #eaeaea;
            border-bottom: 1px solid #eaeaea;
            padding: 14px 0;
            width: 100%;
        }

        .specs-list li {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            margin-bottom: 8px;
            gap: 15px; 
        }

        .specs-list li:last-child {
            margin-bottom: 0;
        }

        .specs-list li span:first-child {
            color: #777;
            flex-shrink: 0; 
            font-weight: 500;
        }

        .specs-list li span:last-child {
            font-weight: 600;
            color: #111;
            text-align: right;
            word-break: break-word; 
            max-width: 70%;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .btn-buy, .btn-cart {
            display: block;
            width: 100%;
            padding: 14px;
            text-align: center;
            text-decoration: none;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.3s;
        }

        .btn-buy {
            background-color: #111;
            color: #fff;
            border: none;
        }

        .btn-buy:hover {
            background-color: #b38228;
        }

        .btn-cart {
            background-color: #f4f4f4;
            color: #111;
            border: 1px solid #ddd;
        }

        .btn-cart:hover {
            background-color: #111;
            color: #fff;
            border-color: #111;
        }

        /* ПЛАВАЮЩИЙ ВИДЖЕТ КОРЗИНЫ */
        .floating-cart-btn {
            position: fixed;
            bottom: calc(25px + var(--sab));
            right: 20px;
            z-index: 9998;
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            color: #111111;
            padding: 12px 18px;
            border-radius: 50px;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(0, 0, 0, 0.14);
            cursor: pointer;
            opacity: 0;
            visibility: hidden;
            transform: translateY(20px) scale(0.9);
            pointer-events: none;
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .floating-cart-btn.visible {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .floating-cart-btn svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            stroke-width: 2.2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .cart-badge {
            background: #b38228;
            color: #ffffff;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            line-height: 1;
            min-width: 18px;
            text-align: center;
        }

        /* Уведомление */
        .toast-notification {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.85);
            background-color: rgba(17, 17, 17, 0.85);
            backdrop-filter: blur(8px);
            color: #fff;
            padding: 16px 32px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            font-size: 0.95rem;
            font-weight: 600;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10001;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .toast-notification.show {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
            visibility: visible;
        }

        /* ПОЛНОЭКРАННОЕ МОДАЛЬНОЕ ОКНО */
        .image-modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(8px);
            z-index: 20000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .image-modal-overlay.active { display: flex; }

        .image-modal-content {
            max-width: 90vw;
            max-height: 90vh;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-modal-content img, .image-modal-content video {
            max-width: 100%;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 12px;
        }

        .image-modal-close {
            position: absolute;
            top: 20px; right: 25px;
            font-size: 2.2rem;
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            cursor: pointer;
            z-index: 20001;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-modal-prev, .image-modal-next {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            border: none;
            font-size: 1.8rem;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 20002;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-modal-prev { left: 25px; }
        .image-modal-next { right: 25px; }

        footer {
            text-align: center;
            padding: 25px 15px calc(25px + var(--sab)) 15px;
            background-color: #f4f4f4;
            border-top: 1px solid #eaeaea;
            color: #666;
            margin-top: 40px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        /* === МОБИЛЬНАЯ АДАПТАЦИЯ И СВАЙПЫ === */
        @media (max-width: 768px) {
            .product-container {
                grid-template-columns: 1fr;
                gap: 20px;
                margin: 10px auto;
                padding: 0 16px;
            }

            .main-image-box {
                height: 300px;
                border-radius: 14px;
            }

            .thumbs-grid {
                overflow-x: auto;
                scroll-snap-type: x mandatory;
                -webkit-overflow-scrolling: touch;
                padding-bottom: 8px;
                scrollbar-width: none;
                width: 100%;
                box-sizing: border-box;
            }
            .thumbs-grid::-webkit-scrollbar {
                display: none;
            }

            .thumb-item {
                width: 75px;
                height: 75px;
                scroll-snap-align: start; 
                flex-shrink: 0;
            }

            .product-title { font-size: 1.4rem; }
            .product-price { font-size: 1.25rem; }
            .btn-buy, .btn-cart { padding: 13px 20px; font-size: 0.95rem; }

            .floating-cart-btn {
                padding: 10px 14px;
                right: 14px;
                bottom: calc(20px + var(--sab));
            }

            .image-modal-prev, .image-modal-next { 
                display: none !important; 
            }
            .image-modal-close { 
                top: 10px; right: 15px; width: 36px; height: 36px; font-size: 1.8rem; 
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" onclick="sessionStorage.removeItem('catalog_scroll_pos');">
            <img src="logo.png" alt="Heaven Heart" class="header-logo">
        </a>
        <p>Bags & Accessories Collection</p>
    </header>

    <div class="product-container">
        <!-- Блок галереи фотографий -->
        <div class="product-gallery">
            <div class="main-image-box" onclick="openImageModal()">
                <img src="logo.png" alt="Загрузка..." style="width: 100%; height: 100%; object-fit: cover;">
            </div>
            <div class="thumbs-grid"></div>
        </div>

        <!-- Блок описания и покупки -->
        <div class="product-details">
            <div class="product-header-row">
                <div class="product-title-group">
                    <div class="brand-tag">Heaven Heart Archive</div>
                    <h1 class="product-title">Загрузка...</h1>
                </div>
                <a href="index.html" class="back-to-catalog-btn">← Каталог</a>
            </div>

            <div class="product-price">...</div>
            
            <div class="condition-badge" style="display: none;"></div>

            <p class="product-description"></p>

            <ul class="specs-list" style="display: none;"></ul>

            <div class="btn-group">
                <button class="btn-buy">Купить за 1 клик</button>
                <button class="btn-cart">В корзину</button>
            </div>
        </div>
    </div>

    <!-- ПОЛНОЭКРАННОЕ МОДАЛЬНОЕ ОКНО -->
    <div class="image-modal-overlay" id="imageModal" onclick="closeImageModal(event)">
        <button class="image-modal-close" onclick="closeImageModal()">&times;</button>
        <button class="image-modal-prev" onclick="event.stopPropagation(); changeModalImage(-1)">&#10094;</button>
        <button class="image-modal-next" onclick="event.stopPropagation(); changeModalImage(1)">&#10095;</button>
        <div class="image-modal-content" id="modalSwipeArea" onclick="event.stopPropagation()">
            <div id="modalMediaContainer" style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;">
                <img id="modalFullImage" src="" alt="Увеличенное фото товара">
            </div>
        </div>
    </div>

    <!-- ПЛАВАЮЩИЙ МИНИ-ВИДЖЕТ КОРЗИНЫ -->
    <div class="floating-cart-btn" id="floatingCartBtn" onclick="window.location.href='cart.html'" title="Корзина">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
        </svg>
        <span class="cart-badge" id="cartBadge">0</span>
    </div>

    <!-- TOAST-УВЕДОМЛЕНИЕ -->
    <div id="toastNotification" class="toast-notification">
        <span class="toast-icon">✓</span>
        <span id="toastMessage">Товар добавлен в корзину</span>
    </div>

    <footer>
        <p>&copy; 2026 Heaven Heart Archive. Все права защищены. | <a href="https://t.me/bandos158" target="_blank">Магазин в Telegram</a></p>
    </footer>

    <script>
        const CATALOG_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyY9UDae3UxnZ7HaqJbzCpaq29PZghWEgfzsDd0n7YGfx7aItb-pCD1g0587gmLJ8_3cg/exec';
        let currentProductImage = 'logo.png';
        let productImages = ['logo.png'];
        let currentImageIndex = 0;
        let toastTimeout;

        function renderProductData(data, productId) {
            const product = data.find(item => String(item.id) === String(productId));

            if (product) {
                let cleanPrice = 0;
                if (product.price !== undefined && product.price !== null && product.price !== '') {
                    let stringPrice = String(product.price).trim();
                    if (/^\d+([.,]\d+)?$/.test(stringPrice)) {
                        cleanPrice = Math.round(parseFloat(stringPrice.replace(',', '.'))) || 0;
                    }
                }
                const priceStr = cleanPrice > 0 ? cleanPrice.toLocaleString('ru-RU') + ' ₽' : (product.price ? String(product.price) : 'Цена по запросу');
                const safeTitle = (product.title || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');

                document.title = product.title + " — Heaven Heart";
                document.querySelector('.brand-tag').textContent = product.brand || 'Heaven Heart Archive';
                document.querySelector('.product-title').textContent = product.title;
                document.querySelector('.product-price').textContent = priceStr;
                document.querySelector('.product-description').textContent = product.desc || '';
                
                const conditionEl = document.querySelector('.condition-badge');
                if (product.condition) {
                    conditionEl.innerHTML = `✨ Состояние: ${product.condition}`;
                    conditionEl.style.display = 'inline-flex';
                } else {
                    conditionEl.style.display = 'none';
                }

                const specsList = document.querySelector('.specs-list');
                let specsHtml = '';
                if (product.material) specsHtml += `<li><span>Материал:</span> <span>${product.material}</span></li>`;
                if (product.hardware) specsHtml += `<li><span>Фурнитура:</span> <span>${product.hardware}</span></li>`;
                if (product.kit)      specsHtml += `<li><span>Комплектация:</span> <span>${product.kit}</span></li>`;
                
                if (specsHtml) {
                    specsList.innerHTML = specsHtml;
                    specsList.style.display = 'block';
                } else {
                    specsList.style.display = 'none';
                }
                
                productImages = product.images ? product.images.split(',').map(s => s.trim()) : ['logo.png'];
                currentImageIndex = 0;
                currentProductImage = productImages[0];
                
                const mainImageBox = document.querySelector('.main-image-box');
                const thumbsGrid = document.querySelector('.thumbs-grid');
                thumbsGrid.innerHTML = '';
                
                function getMediaHTML(src, isMain) {
                    if (src.endsWith('.webm') || src.endsWith('.mp4')) {
                        return `<video ${isMain ? 'autoplay loop muted playsinline' : 'muted loop playsinline'} style="width: 100%; height: 100%; object-fit: cover;"><source src="${src}" type="video/${src.endsWith('.webm') ? 'webm' : 'mp4'}"></video>`;
                    }
                    return `<img src="${src}" alt="Фото товара" style="width: 100%; height: 100%; object-fit: cover;">`;
                }

                mainImageBox.innerHTML = getMediaHTML(currentProductImage, true);
                
                productImages.forEach((imgSrc, index) => {
                    const thumb = document.createElement('div');
                    thumb.className = 'thumb-item' + (index === 0 ? ' active' : '');
                    thumb.onclick = function() { 
                        currentImageIndex = index;
                        currentProductImage = imgSrc;
                        mainImageBox.innerHTML = getMediaHTML(imgSrc, true);
                        document.querySelectorAll('.thumb-item').forEach(el => el.classList.remove('active'));
                        this.classList.add('active');
                    };
                    thumb.innerHTML = getMediaHTML(imgSrc, false);
                    thumbsGrid.appendChild(thumb);
                });

                document.querySelector('.btn-buy').setAttribute('onclick', `buyNowFromPage('${safeTitle}', ${cleanPrice}, '${product.id}')`);
                document.querySelector('.btn-cart').setAttribute('onclick', `addToCartFromPage('${safeTitle}', ${cleanPrice}, '${product.id}')`);
            } else {
                document.querySelector('.product-title').textContent = "Товар не найден в базе";
            }
        }

        window.addEventListener('DOMContentLoaded', async () => {
            updateCartBadge();
            
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');

            if (!productId) {
                document.querySelector('.product-title').textContent = "Товар не выбран";
                return;
            }

            try {
                let cachedData = JSON.parse(localStorage.getItem('hh_catalog_cache'));
                if (cachedData && Array.isArray(cachedData) && cachedData.length > 0) {
                    renderProductData(cachedData, productId);
                }

                const response = await fetch(CATALOG_WEB_APP_URL);
                const freshData = await response.json();

                if (freshData && Array.isArray(freshData) && freshData.length > 0) {
                    localStorage.setItem('hh_catalog_cache', JSON.stringify(freshData));
                    renderProductData(freshData, productId);
                }
            } catch (error) {
                console.error('Ошибка загрузки товара:', error);
                let cachedData = JSON.parse(localStorage.getItem('hh_catalog_cache'));
                if (cachedData && Array.isArray(cachedData) && cachedData.length > 0) {
                    renderProductData(cachedData, productId);
                } else {
                    document.querySelector('.product-title').textContent = "Ошибка загрузки товара";
                }
            }
        });

        function buyNowFromPage(name, price, itemId) {
            let cart = JSON.parse(localStorage.getItem('hh_cart')) || [];
            
            let existingItem = cart.find(item => String(item.id) === String(itemId));
            let currentQuantity = existingItem ? (existingItem.quantity || 1) : 0;

            if (currentQuantity >= 3) {
                showToast(`Лимит: не более 3 шт.`);
                return;
            }

            if (existingItem) {
                existingItem.quantity = (existingItem.quantity || 1) + 1;
            } else {
                cart.push({ id: String(itemId), name: name, price: price, image: currentProductImage, quantity: 1, url: window.location.href });
            }

            localStorage.setItem('hh_cart', JSON.stringify(cart));
            window.location.href = 'cart.html';
        }

        function openImageModal() {
            if (!productImages || productImages.length === 0) return;
            updateModalMedia();
            document.getElementById('imageModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function updateModalMedia() {
            const container = document.getElementById('modalMediaContainer');
            const src = productImages[currentImageIndex];
            currentProductImage = src;

            if (src.endsWith('.webm') || src.endsWith('.mp4')) {
                container.innerHTML = `<video controls autoplay playsinline style="max-width: 100%; max-height: 90vh; object-fit: contain;"><source src="${src}" type="video/${src.endsWith('.webm') ? 'webm' : 'mp4'}"></video>`;
            } else {
                container.innerHTML = `<img src="${src}" alt="Увеличенное фото товара" style="max-width: 100%; max-height: 90vh; object-fit: contain;">`;
            }

            const mainImageBox = document.querySelector('.main-image-box');
            if (src.endsWith('.webm') || src.endsWith('.mp4')) {
                mainImageBox.innerHTML = `<video autoplay loop muted playsinline style="width: 100%; height: 100%; object-fit: cover;"><source src="${src}" type="video/${src.endsWith('.webm') ? 'webm' : 'mp4'}"></video>`;
            } else {
                mainImageBox.innerHTML = `<img src="${src}" alt="Фото товара" style="width: 100%; height: 100%; object-fit: cover;">`;
            }

            const thumbs = document.querySelectorAll('.thumb-item');
            thumbs.forEach((el, idx) => {
                if (idx === currentImageIndex) {
                    el.classList.add('active');
                    el.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                } else {
                    el.classList.remove('active');
                }
            });
        }

        function changeModalImage(direction) {
            currentImageIndex += direction;
            if (currentImageIndex < 0) {
                currentImageIndex = productImages.length - 1;
            } else if (currentImageIndex >= productImages.length) {
                currentImageIndex = 0;
            }
            updateModalMedia();
        }

        function closeImageModal(event) {
            if (!event || event.target.id === 'imageModal' || event.target.classList.contains('image-modal-close')) {
                document.getElementById('imageModal').classList.remove('active');
                document.body.style.overflow = '';
            }
        }

        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeImageModal();
            }
            if (document.getElementById('imageModal').classList.contains('active')) {
                if (event.key === 'ArrowLeft') {
                    changeModalImage(-1);
                } else if (event.key === 'ArrowRight') {
                    changeModalImage(1);
                }
            }
        });

        // Скрипт для свайпа фотографий
        let touchstartX = 0;
        let touchendX = 0;
        const modalSwipeArea = document.getElementById('modalSwipeArea');
        
        modalSwipeArea.addEventListener('touchstart', e => {
            touchstartX = e.changedTouches[0].screenX;
        }, {passive: true});

        modalSwipeArea.addEventListener('touchend', e => {
            touchendX = e.changedTouches[0].screenX;
            handleSwipe();
        }, {passive: true});

        function handleSwipe() {
            if (touchendX < touchstartX - 40) changeModalImage(1);
            if (touchendX > touchstartX + 40) changeModalImage(-1);
        }

        function addToCartFromPage(name, price, itemId) {
            let cart = JSON.parse(localStorage.getItem('hh_cart')) || [];
            
            let existingItem = cart.find(item => String(item.id) === String(itemId));
            let currentQuantity = existingItem ? (existingItem.quantity || 1) : 0;

            if (currentQuantity >= 3) {
                showToast(`Лимит: не более 3 шт.`);
                return;
            }

            if (existingItem) {
                existingItem.quantity = (existingItem.quantity || 1) + 1;
            } else {
                cart.push({ id: String(itemId), name: name, price: price, image: currentProductImage, quantity: 1, url: window.location.href });
            }

            localStorage.setItem('hh_cart', JSON.stringify(cart));
            updateCartBadge();
            showToast(`«${name}» в корзине`);
        }

        function updateCartBadge() {
            let cart = JSON.parse(localStorage.getItem('hh_cart')) || [];
            let totalCount = cart.reduce((sum, item) => sum + (item.quantity || 1), 0);
            const badge = document.getElementById('cartBadge');
            const cartBtn = document.getElementById('floatingCartBtn');
            
            if (badge) badge.textContent = totalCount;
            if (cartBtn) {
                if (totalCount > 0) cartBtn.classList.add('visible');
                else cartBtn.classList.remove('visible');
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toastNotification');
            const toastMsg = document.getElementById('toastMessage');
            toastMsg.textContent = message;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toast.classList.remove('show'), 2500);
        }
    </script>
</body>
</html>
